    <style>
      table {
        width: 50%;
        height: 50vh;
        margin: 30px auto 0;
        border-collapse: collapse;
        border: 2px solid #198754;
        font-family: Arial, sans-serif;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      td {
        padding: 10px 15px;
        text-align: center;
        border: 1px solid #ccc;
      }

      tr:first-child {
        background-color: #198754;
        color: white;
        font-weight: bold;
      }

      table {
        width: 50%;
        height: 50vh;
        margin: 30px auto 0;
        border-collapse: collapse;
        border: 2px solid #198754;
        font-family: Arial, sans-serif;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      td {
        padding: 10px 15px;
        text-align: center;
        border: 1px solid #ccc;
      }

      tr:first-child {
        background-color: #198754;
        color: white;
        font-weight: bold;
      }

      td:nth-child(1),
      td:nth-child(2) {
        border-right: 2px solid #198754;
      }

      tr:not(:first-child):hover {
        background-color: #e8f5e9;
      }

      tr:not(:first-child):hover {
        background-color: #e8f5e9;
      }

      .background {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      .line {
        position: absolute;
        width: 2px;
        height: 100%;
        background: linear-gradient(135deg, #198754, #7d7d7d, #198754);
        animation: move 12s linear infinite;
      }

      .line:nth-child(1) {
        left: 20%;
        animation-duration: 12s;
      }

      .line:nth-child(2) {
        left: 40%;
        animation-duration: 15s;
      }

      .line:nth-child(3) {
        left: 60%;
        animation-duration: 13s;
      }

      .line:nth-child(4) {
        left: 85%;
        animation-duration: 17s;
      }

      @keyframes move {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(0);
        }
      }
    </style>
